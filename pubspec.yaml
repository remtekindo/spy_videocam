name: cctv
description: Spy VideoCam - Turn your old Android phone into a CCTV camera
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Kamera
  camera: ^0.11.0
  # Path storage
  path_provider: ^2.1.2
  # Foreground service
  flutter_foreground_task: ^8.0.0
  # Wake lock
  wakelock_plus: ^1.2.8
  # Permission handler
  permission_handler: ^11.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  device_info_plus: ^10.1.0
  permission_handler: ^11.3.0

flutter:
  uses-material-design: true